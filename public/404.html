<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect: preserve the path in sessionStorage
      // then redirect to the base URL so index.html can restore it.
      var path = location.pathname.replace(/^\/Portfolio/, '') + location.search + location.hash;
      sessionStorage.setItem('spa_redirect', path);
    </script>
    <meta http-equiv="refresh" content="0;URL='/Portfolio/'" />
  </head>
</html>
