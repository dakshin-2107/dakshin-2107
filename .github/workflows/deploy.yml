name: Build and Deploy

on:
  push:
    branches: [portfolio]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t portfolio:latest .

      - name: Restart container
        run: |
          docker stop portfolio || true
          docker rm portfolio || true
          docker run -d \
            --name portfolio \
            --restart unless-stopped \
            -p 8080:80 \
            portfolio:latest
